<ion-content [fullscreen]="true">
  <div class="forgot-container">

    <div class="forgot-card">
      <div class="logo-section">
        <img
          src="assets/logo.jpg"
          alt="Medicine Intake Logo"
          class="app-logo">

        <h1> {{ appName }} </h1>
        <p> Application </p>
      </div>

      <div class="section-divider"></div>

      <div class="welcome-section">
        <h2> Forgot Password? </h2>
        <p> Enter your account details to reset your password. </p>
      </div>

      <div class="form-section">
        <ion-label> Username </ion-label>
        <ion-input
          type="text"
          placeholder="Enter your username"
          fill="outline"
          [(ngModel)]="username">
        </ion-input>

        <ion-label> Recovery Code </ion-label>
        <ion-input
          type="text"
          placeholder="Enter your recovery code"
          fill="outline"
          [(ngModel)]="recoveryCode">
        </ion-input>

        <ion-label> New Password </ion-label>
        <ion-input
          type="password"
          placeholder="Enter your new password"
          fill="outline"
          [(ngModel)]="newPassword">
        </ion-input>

        <ion-label> Confirm New Password </ion-label>
        <ion-input
          type="password"
          placeholder="Confirm your new password"
          fill="outline"
          [(ngModel)]="confirmPassword">
        </ion-input>

        <ion-button expand="block">
          Reset Password
        </ion-button>

        <div class="login-section">
          <p> Remember your password? <a routerLink="/login"> Login </a> </p>
        </div>
      </div>

    </div>
  </div>
</ion-content>
