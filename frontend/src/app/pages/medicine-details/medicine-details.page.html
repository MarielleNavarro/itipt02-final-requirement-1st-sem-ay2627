
<ion-content [fullscreen]="true">

  <div class="details-container">

    <!-- page header -->
    <div class="page-header">
      <ion-icon name="arrow-back-outline"></ion-icon>
      <h1>Medicine Details</h1>
    </div>

    <!-- medicine image -->
    <div class="medicine-image-section">
      <div class="medicine-image">
        <ion-icon name="medkit-outline"></ion-icon>
      </div>
    </div>

    <!-- medicine name and category -->
    <div class="medicine-heading">
      <h2>Paracetamol</h2>
      <span class="category-tag temporary">Temporary</span>
    </div>

    <!-- medicine information -->
    <div class="details-card">

      <!-- dosage and reason -->
      <div class="detail-row">

        <div class="detail-item">
          <span class="detail-label">Dosage:</span>
          <p>500 mg</p>
        </div>

        <div class="detail-item">
          <span class="detail-label">Reason:</span>
          <p>Fever</p>
        </div>

      </div>

      <!-- intake period -->
      <div class="detail-item intake-period">
        <span class="detail-label">Intake Period</span>
        <p>Jun 1 - Jun 3, 2026</p>
      </div>

    </div>

  </div>

  <!-- fixed bottom action buttons -->
  <div class="action-buttons">

    <button class="edit-button">
      <ion-icon name="create-outline"></ion-icon>
      <span>Edit</span>
    </button>

    <button class="delete-button">
      <ion-icon name="trash-outline"></ion-icon>
      <span>Delete</span>
    </button>

  </div>

</ion-content>
