
<ion-content [fullscreen]="true">
  <div class="edit-medicine-container">

    <!-- PAGE HEADER -->
    <div class="page-header">
      <ion-icon
        name="arrow-back-outline"
        [routerLink]="['/medicine-details', medicineId]"
        style="cursor: pointer;">
      </ion-icon>
      <h1>Edit Medicine</h1>
    </div>

    <!-- LOADING MESSAGE -->
    <div *ngIf="isLoading">
      <p>Loading medicine details...</p>
    </div>

    <!-- MEDICINE FORM -->
    <div class="medicine-form" *ngIf="!isLoading && medicine">

      <!-- MEDICINE IMAGE -->
      <div class="image-upload-section">

        <!-- HIDDEN IMAGE INPUT -->
      <input
        #imageInput
        type="file"
        accept="image/jpeg,image/png,image/webp"
        hidden
        (change)="onImageSelected($event)"
      />

      <!-- IMAGE PREVIEW -->
      <div
        class="image-upload-box"
        (click)="imageInput.click()"
      >

        <ng-container *ngIf="imagePreview; else uploadPrompt">

          <img
            [src]="imagePreview"
            alt="Medicine Preview"
            class="medicine-image-preview"
          />

          <p>Change Medicine Image</p>
          <span>Tap to choose another photo</span>

        </ng-container>

        <ng-template #uploadPrompt>
          <ion-icon name="camera-outline"></ion-icon>
          <p>Upload Medicine Image</p>
          <span>Tap to choose from photos</span>
        </ng-template>

      </div>

      </div>

      <!-- MEDICINE NAME -->
      <div class="form-group">
        <label>Medicine Name</label>
        <input
          type="text"
          [(ngModel)]="medicineName">
      </div>

      <!-- DOSAGE -->
      <div class="form-group">
        <label>Dosage</label>
        <input
          type="text"
          [(ngModel)]="dosage">
      </div>

      <!-- CATEGORY -->
      <div class="form-group">
        <label>Category</label>

        <div class="category-options">
          <button
            type="button"
            class="category-button"
            [class.active]="category === 'Maintenance'"
            (click)="category = 'Maintenance'">
            Maintenance
          </button>

          <button
            type="button"
            class="category-button"
            [class.active]="category === 'Temporary'"
            (click)="category = 'Temporary'">
            Temporary
          </button>
        </div>
      </div>

      <!-- REASON -->
      <div class="form-group">
        <label>Reason for Taking</label>
        <input
          type="text"
          [(ngModel)]="reason">
      </div>

      <!-- DATES -->
      <div class="date-row">

        <div class="form-group">
          <label>Start Date</label>
          <input
            type="date"
            [(ngModel)]="startDate">
        </div>

        <div class="form-group">
          <label>End Date</label>
          <input
            type="date"
            [(ngModel)]="endDate">
        </div>

      </div>

      <!-- NOTES -->
      <div class="form-group">
        <label>Notes (Optional)</label>
        <textarea
          rows="3"
          placeholder="Add notes here..."
          [(ngModel)]="notes">
        </textarea>
      </div>

      <!-- UPDATE BUTTON -->
      <button
        type="button"
        class="save-button"
        [disabled]="!hasChanges"
        [class.disabled]="!hasChanges"
        (click)="updateMedicine()"
        [style.cursor]="hasChanges ? 'pointer' : 'not-allowed'">
        Update Medicine
      </button>

    </div>

  </div>
</ion-content>
