
<ion-content [fullscreen]="true">
  <div class="add-medicine-container">

    <!-- page header -->
    <div class="page-header">
      <ion-icon name="arrow-back-outline" routerLink="/dashboard"></ion-icon>
      <h1>Add Medicine</h1>
    </div>

    <!-- medicine image upload -->
    <div class="image-upload-section">

      <!-- HIDDEN IMAGE INPUT -->
      <input
        #imageInput
        type="file"
        accept="image/jpeg,image/png,image/webp"
        hidden
        (change)="onImageSelected($event)"
      />

      <!-- IMAGE PREVIEW -->
      <div
        class="image-upload-box"
        (click)="imageInput.click()"
      >

        <ng-container *ngIf="imagePreview; else uploadPrompt">
          <img
            [src]="imagePreview"
            alt="Medicine Preview"
            class="medicine-image-preview"
          />

          <p>Change Medicine Image</p>
          <span>Tap to choose another photo</span>
        </ng-container>

        <ng-template #uploadPrompt>
          <ion-icon name="camera-outline"></ion-icon>
          <p>Upload Medicine Image</p>
          <span>Tap to choose from photos</span>
        </ng-template>

      </div>

    </div>

    <!-- medicine form -->
    <div class="medicine-form">

      <div class="form-group">
        <label>Medicine Name</label>
        <input
          type="text"
          placeholder="e.g. Paracetamol"
          [(ngModel)]="medicineName">
      </div>

      <!-- DOSAGE -->
      <div class="form-group">
        <label>Dosage</label>

        <div class="dosage-row">
          <input
            type="number"
            min="0"
            step="any"
            placeholder="e.g. 500"
            [(ngModel)]="dosageAmount"
            name="dosageAmount"
          >

          <select
            [(ngModel)]="dosageUnit"
            name="dosageUnit">

            <option value="mg">mg</option>
            <option value="mcg">mcg</option>
            <option value="g">g</option>
            <option value="mL">mL</option>
            <option value="tablet">Tablet</option>
            <option value="capsule">Capsule</option>
            <option value="drops">Drops</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <input
          *ngIf="dosageUnit === 'Other'"
          type="text"
          placeholder="Enter dosage unit"
          [(ngModel)]="customDosageUnit"
          name="customDosageUnit"
        >
      </div>

      <div class="form-group">
        <label>Category</label>
        <div class="category-options">
          <button
            type="button"
            class="category-button"
            [class.active]="category === 'Maintenance'"
            (click)="category = 'Maintenance'">
            Maintenance
          </button>

          <button
            type="button"
            class="category-button"
            [class.active]="category === 'Temporary'"
            (click)="category = 'Temporary'">
            Temporary
          </button>
        </div>
      </div>

      <div class="form-group">
        <label>Reason for Taking</label>
        <input
          type="text"
          placeholder="e.g. Fever"
          [(ngModel)]="reason">
      </div>

      <div class="date-row">
        <div class="form-group">
          <label>Start Date</label>
          <input
            type="date"
            [(ngModel)]="startDate">
        </div>

        <div class="form-group">
          <label>End Date</label>
          <input
            type="date"
            [(ngModel)]="endDate">
        </div>
      </div>

      <!-- INTAKE SCHEDULE -->
      <div class="form-group">
        <label>Intake Schedule</label>

        <div
          class="schedule-card"
          *ngFor="let schedule of intakeTimes; let i = index">

          <div class="schedule-header">
            <span class="schedule-title">Schedule {{ i + 1 }}</span>

            <button
              type="button"
              class="remove-time-button"
              *ngIf="intakeTimes.length > 1"
              (click)="removeIntakeTime(i)">
              <ion-icon name="trash-outline"></ion-icon>
              Remove
            </button>
          </div>

          <div class="time-select-row">

            <div class="time-select-group">
              <label>Hour</label>
              <select
                [(ngModel)]="schedule.hour"
                name="hour{{ i }}">
                <option *ngFor="let hour of hours" [value]="hour">
                  {{ hour }}
                </option>
              </select>
            </div>

            <span class="time-separator">:</span>

            <div class="time-select-group">
              <label>Minute</label>
              <select
                [(ngModel)]="schedule.minute"
                name="minute{{ i }}">
                <option *ngFor="let minute of minutes" [value]="minute">
                  {{ minute }}
                </option>
              </select>
            </div>

          </div>

          <div class="period-options">
            <button
              type="button"
              [class.active]="schedule.period === 'AM'"
              (click)="schedule.period = 'AM'">
              AM
            </button>

            <button
              type="button"
              [class.active]="schedule.period === 'PM'"
              (click)="schedule.period = 'PM'">
              PM
            </button>
          </div>

        </div>

        <button
          type="button"
          class="add-time-button"
          (click)="addIntakeTime()">
          <ion-icon name="add-circle-outline"></ion-icon>
          Add Another Time
        </button>
      </div>


      <div class="form-group">
        <label>Notes (Optional)</label>
        <textarea
          rows="3"
          placeholder="Add notes here..."
          [(ngModel)]="notes"></textarea>
      </div>

      <!-- save button -->
      <button
        type="button"
        class="save-button"
        (click)="addMedicine()">
        Save Medicine
      </button>

    </div>
  </div>
</ion-content>
